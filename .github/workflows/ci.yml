name: AegisMuG Validation

on:
  push:
    branches: [main, feature/aegis-digital-twin-v1]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Scientific model tests
        run: npm run test
      - name: Production build
        run: npm run build
